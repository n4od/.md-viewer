<!doctype html>
<!--
  Front-end tests. Open it from the same dev server as the harness:

    node scripts/dev-server.js
    open http://localhost:8123/preview/tests.html

  Every check drives the real app.js inside an iframe of preview/harness.html, so the
  fixture, the fake Tauri bridge and the markup are reused rather than copied. The
  page prints "RESULT: PASS n/n" or "RESULT: FAIL k/n" and sets data-result, which is
  what CI looks for (see .github/workflows/ci.yml).

  Ticks are microtasks on purpose: an occluded tab throttles timers and animation
  frames, and the fake IPC resolves promises rather than posting messages.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MD Viewer — front-end tests</title>
<style>
  body { font: 13px/1.5 ui-monospace, Consolas, monospace; margin: 24px; color: #20242a; }
  h1 { font: 600 18px/1.2 Georgia, serif; }
  #summary { font-weight: 700; }
  #summary[data-result="pass"] { color: #0a5a50; }
  #summary[data-result="fail"] { color: #b4432f; }
  #log { white-space: pre-wrap; }
  iframe { width: 1024px; height: 768px; border: 1px solid #ccc; margin-top: 16px; }
</style>
</head>
<body>
<h1>MD Viewer — front-end tests</h1>
<p id="summary" data-result="running">running…</p>
<pre id="log"></pre>
<script>
// The suite is one async function; this lets its catch block stop the watchdog even
// though the timer itself lives inside the function's scope.
var stopWatchdog = function () {};
(async function () {
  const log = document.getElementById("log");
  const summary = document.getElementById("summary");
  const results = [];
  let stage = "startup";

  // A hang must not look like a slow run: CI only dumps the DOM, so an await that never
  // settles would leave the page saying "running" with no clue where it stopped. Virtual
  // time only advances while the page is idle, so this fires on a stall, not on work.
  const watchdog = setTimeout(function () {
    summary.dataset.result = "fail";
    summary.textContent = "RESULT: FAIL timed out at stage: " + stage + " (" + results.length + " checks recorded)";
  }, 20000);
  stopWatchdog = function () { clearTimeout(watchdog); };
  function mark(next) { stage = next; summary.dataset.stage = next; }

  function record(name, ok, detail) {
    results.push({ name, ok: !!ok });
    log.textContent += (ok ? "ok   " : "FAIL ") + name + (ok || !detail ? "" : "  — " + detail) + "\n";
  }
  function is(name, actual, expected) {
    record(name, JSON.stringify(actual) === JSON.stringify(expected), "got " + JSON.stringify(actual) + ", want " + JSON.stringify(expected));
  }
  function ok(name, value, detail) { record(name, !!value, detail); }
  // A microtask turn, so the fake IPC's promises have settled. Declared before the
  // frame helpers, which use it while waiting for an iframe.
  const tick = async function () { await Promise.resolve(); await Promise.resolve(); };

  // Start from a clean slate. The suite shares localStorage with the harness, so a
  // previous run would otherwise leave settings behind and the expectations would
  // depend on the order things were last run in.
  Object.keys(localStorage)
    .filter(function (key) { return key.indexOf("mdviewer.") === 0; })
    .forEach(function (key) { localStorage.removeItem(key); });

  // The load event is not a reliable barrier for an iframe: appending one fires a load
// for its initial about:blank, and if that lands after the listener is attached the
// suite waits on the wrong navigation. Wait for the harness markup instead, yielding
// to a macrotask every few turns — a budget of microtasks alone cannot let a network
// response arrive. (That is exactly how the first CI run of the session-restore check
// saw an empty fixture.)
  async function frameReady(frame) {
    for (let i = 0; i < 400; i++) {
      const framed = frame.contentDocument;
      const win = frame.contentWindow;
      // The markup parses before the app boots, and booting waits on DOMContentLoaded
      // (a task, not a microtask), so the harness flag is the real "ready" signal.
      if (framed && win && win.__previewBooted && framed.getElementById("tabs")) return framed;
      if (i % 4 === 3) await new Promise(function (resolve) { setTimeout(resolve, 0); });
      else await tick();
    }
    throw new Error("the fixture never loaded");
  }

  mark("fixture load");
  const frame = document.createElement("iframe");
  frame.id = "fixture";
  frame.title = "fixture";
  frame.style.cssText = "width:1024px;height:768px;border:1px solid #ccc;margin-top:16px";
  document.body.appendChild(frame);
  frame.src = "harness.html";
  await frameReady(frame);

  const win = frame.contentWindow;
  const doc = frame.contentDocument;
  const q = function (selector) { return doc.querySelector(selector); };
  const qa = function (selector) { return Array.prototype.slice.call(doc.querySelectorAll(selector)); };
  const emit = function (payload) {
    win.__previewEmit("md://open", Object.assign({}, win.__previewPayload, payload));
  };

  // The startup document is asynchronous; let it land.
  mark("startup document");
  for (let i = 0; i < 400 && !q("#doc h1"); i++) await tick();

  /* ---------- the rendered document ---------- */
  mark("rendered document");
  ok("sample renders", q("#doc h1"), "no h1 in #doc");

  const headings = qa("#doc h1,#doc h2,#doc h3,#doc h4,#doc h5,#doc h6");
  const ids = headings.map(function (h) { return h.id; });
  ok("every heading has an id", headings.length > 0 && ids.every(Boolean));
  is("heading ids are unique", new Set(ids).size, ids.length);

  const tocLinks = qa("#toc-list a");
  is("outline lists every heading", tocLinks.length, headings.length);
  ok("outline labels carry no anchor glyph", tocLinks.every(function (a) { return a.textContent.indexOf("#") === -1; }));

  const tables = qa("#doc table");
  const wraps = qa("#doc .table-scroll");
  ok("tables are wrapped for sideways scroll", tables.length > 0 && wraps.length === tables.length);

  is("code blocks get a toolbar", qa("#doc .code-block").length, qa("#doc pre").length);
  is("each toolbar has a copy button", qa("#doc .copy-btn").length, qa("#doc .code-block").length);

  const tokens = qa("#doc code [class^='tok-']");
  ok("fenced code is highlighted", tokens.length > 0);
  const kinds = new Set(tokens.map(function (s) { return s.className; }));
  ["tok-c", "tok-s", "tok-n", "tok-k", "tok-t", "tok-a"].forEach(function (kind) {
    ok("token class present: " + kind, kinds.has(kind));
  });

  const image = q("#doc img");
  ok("local image rewritten to the asset URL", image && image.getAttribute("src").indexOf("src-tauri/icons/icon.png") !== -1, image ? image.getAttribute("src") : "no image");

  /* ---------- pinned section title ---------- */
  mark("pinned title");
  const bar = doc.getElementById("sticky-head");
  ok("pinned title is visible with a document", bar && win.getComputedStyle(bar).display !== "none");
  ok("pinned title has text", bar && bar.textContent.trim().length > 0);

  /* ---------- image lightbox ---------- */
  mark("lightbox");
  const box = doc.getElementById("lightbox");
  image.click();
  await tick();
  ok("clicking an image opens the lightbox", !box.hidden && doc.getElementById("lightbox-img").getAttribute("src"));
  box.click();
  await tick();
  ok("clicking the backdrop closes the lightbox", box.hidden);

  /* ---------- tabs ---------- */
  mark("tabs");
  const strip = doc.getElementById("tabs");
  ok("no tab strip for a single document", strip.hidden && strip.querySelectorAll(".tab").length === 0);

  emit({ path: "C:/notes/second.md", name: "second.md", html: '<h1 id="s">Second</h1><p>one</p>' });
  await tick();
  is("a second document opens a tab", strip.querySelectorAll(".tab").length, 2);
  is("--tabs-h rises for the strip", win.getComputedStyle(doc.body).getPropertyValue("--tabs-h").trim(), "34px");
  is("the new tab is active", q(".tab.active .tab-open").textContent, "second.md");

  /* the strip is a tablist, not a row of links */
  const tabOpens = qa("#tabs .tab-open");
  const tabCloses = qa("#tabs .tab-close");
  is("the strip is a tablist", strip.getAttribute("role"), "tablist");
  ok("each tab is a role=tab", tabOpens.every(function (b) { return b.getAttribute("role") === "tab"; }));
  ok("each wrapper is presentational", qa("#tabs .tab").every(function (w) { return w.getAttribute("role") === "presentation"; }));
  is("only the active tab is selected", tabOpens.map(function (b) { return b.getAttribute("aria-selected"); }), ["false", "true"]);
  is("roving tabindex follows the active tab", tabOpens.map(function (b) { return b.tabIndex; }), [-1, 0]);

  /* keyboard inside the strip: arrows and Home/End activate as they move */
  function press(target, key, opts) {
    target.dispatchEvent(new win.KeyboardEvent("keydown", Object.assign({ key: key, bubbles: true }, opts || {})));
  }
  const activeName = function () { return q(".tab.active .tab-open").textContent; };
  tabOpens[1].focus();
  press(tabOpens[1], "ArrowLeft");
  await tick(); await tick();
  is("ArrowLeft activates the previous tab", activeName(), "sample.md");
  is("arrow keys keep focus in the strip", doc.activeElement, q(".tab.active .tab-open"));

  press(doc.activeElement, "ArrowRight");
  await tick(); await tick();
  is("ArrowRight activates the next tab", activeName(), "second.md");

  press(doc.activeElement, "Home");
  await tick(); await tick();
  is("Home goes to the first tab", activeName(), "sample.md");
  press(doc.activeElement, "End");
  await tick(); await tick();
  is("End goes to the last tab", activeName(), "second.md");

  /* Ctrl+Tab walks the strip and wraps, like a browser */
  press(doc.activeElement, "Tab", { ctrlKey: true });
  await tick(); await tick();
  is("Ctrl+Tab wraps to the first tab", activeName(), "sample.md");
  press(doc.activeElement, "Tab", { ctrlKey: true, shiftKey: true });
  await tick(); await tick();
  is("Ctrl+Shift+Tab wraps back", activeName(), "second.md");

  /* a click on another tab keeps focus where the user left it */
  tabOpens[0].focus();
  tabOpens[0].click();
  await tick(); await tick();
  is("clicking a tab keeps focus on it", doc.activeElement, q(".tab.active .tab-open"));
  ok("switching tabs loads that document", doc.getElementById("doc-title").textContent.indexOf("sample") !== -1, doc.getElementById("doc-title").textContent);

  /* the strip is persisted so a session can be restored */
  const savedTabs = JSON.parse(win.localStorage.getItem("mdviewer.tabs") || "null");
  is("the tab set is stored", savedTabs && savedTabs.paths, ["C:\\notes\\md-viewer\\sample.md", "C:/notes/second.md"]);
  is("the stored active tab is the one on screen", savedTabs && savedTabs.active, "C:\\notes\\md-viewer\\sample.md");

  /* middle-click closes the tab under the pointer, not the active one */
  tabOpens[1].dispatchEvent(new win.MouseEvent("auxclick", { button: 1, bubbles: true }));
  await tick(); await tick();
  ok("middle-click closes a background tab", strip.hidden);
  ok("the active document is untouched", doc.getElementById("doc-title").textContent.indexOf("sample") !== -1, doc.getElementById("doc-title").textContent);

  /* Ctrl+W closes the active tab and hands focus back */
  emit({ path: "C:/notes/second.md", name: "second.md", html: '<h1 id="s">Second</h1><p>one</p>' });
  await tick();
  is("the tab is back for the close test", strip.querySelectorAll(".tab").length, 2);
  is("the second document is active again", activeName(), "second.md");
  press(doc.activeElement, "w", { ctrlKey: true });
  await tick(); await tick();
  ok("Ctrl+W closes the active tab", strip.hidden);
  is("a single tab is not persisted", win.localStorage.getItem("mdviewer.tabs"), null);
  ok("the neighbour is on screen", q("#doc h1"));

  /* ---------- settings ---------- */
  mark("settings");
  const panel = doc.getElementById("settings");
  const gear = doc.getElementById("btn-settings");
  gear.click();
  await tick();
  ok("the gear opens a modal settings dialog", panel.open && panel.matches(":modal"));
  is("the page behind is locked", win.getComputedStyle(doc.documentElement).overflow, "hidden");

  panel.querySelector('button[data-theme="light"]').click();
  await tick();
  is("theme applies from the panel", doc.documentElement.getAttribute("data-theme"), "light");
  is("theme is remembered", win.localStorage.getItem("mdviewer.theme"), "light");

  panel.querySelector('button[data-width="wide"]').click();
  await tick();
  is("reading width applies", doc.documentElement.getAttribute("data-width"), "wide");

  const before = doc.getElementById("opt-scale-value").textContent;
  doc.getElementById("opt-scale-up").click();
  await tick();
  ok("text size steps up", doc.getElementById("opt-scale-value").textContent !== before, before + " -> " + doc.getElementById("opt-scale-value").textContent);

  const resumeBox = doc.getElementById("opt-position");
  const wasResume = resumeBox.checked;
  resumeBox.click();
  await tick();
  is("resume-position setting persists", win.localStorage.getItem("mdviewer.resume"), wasResume ? "off" : "on");
  // Leave it enabled for the reading-position check below.
  win.localStorage.setItem("mdviewer.resume", "on");

  const caseBtn = doc.getElementById("opt-case");
  const wasCase = caseBtn.getAttribute("aria-pressed") === "true";
  caseBtn.click();
  await tick();
  is("find defaults move the find bar's own toggle", doc.getElementById("find-case").getAttribute("aria-pressed"), String(!wasCase));

  const closed = new Promise(function (resolve) { panel.addEventListener("close", resolve, { once: true }); });
  panel.click();
  ok("a click outside closes the dialog", !panel.open);
  // close() fires its event as a task, which is where the scroll lock is released.
  await closed;
  await tick();
  is("the scroll lock is released", win.getComputedStyle(doc.documentElement).overflow, "visible");

  /* ---------- per-document reading position ---------- */
  mark("reading position");
  let tall = "";
  for (let i = 0; i < 200; i++) tall += '<h2 id="t' + i + '">Section ' + i + "</h2><p>Filler " + i + ".</p>";
  win.localStorage.setItem("mdviewer.positions", JSON.stringify({ "C:/notes/tall.md": 400 }));
  emit({ path: "C:/notes/tall.md", name: "tall.md", html: tall });
  await tick(); await tick();
  ok("a stored reading position is restored", Math.abs(win.scrollY - 400) <= 2, "scrollY " + win.scrollY);

  /* ---------- progressive rendering ---------- */
  mark("progressive rendering");
  let big = "";
  let sections = 0;
  while (big.length <= 1048576) {
    big += '<h2 id="b' + sections + '">Big ' + sections + "</h2><p>Paragraph " + sections + " with enough words to make the document large.</p>";
    sections++;
  }
  emit({ path: "C:/notes/big.md", name: "big.md", html: big });
  for (let i = 0; i < 400 && qa("#doc h2").length < sections; i++) await tick();
  ok("the big document crosses the progressive threshold", big.length > 1048576, big.length + " bytes");
  is("progressive rendering completes every chunk", qa("#doc h2").length, sections);
  is("its outline is complete too", qa("#toc-list a").length, sections);
  ok("its first heading kept its id", !!doc.getElementById("b0"));
  ok("its last heading kept its id", !!doc.getElementById("b" + (sections - 1)));

  /* ---------- session restore ---------- */
  mark("session restore");
  // A second fixture that starts with no document (?empty=1 makes initial_document
  // resolve null), which is the only situation where a stored session is restored —
  // a file named on the command line still wins.
  win.localStorage.setItem("mdviewer.reopen", "on");
  win.localStorage.setItem("mdviewer.tabs", JSON.stringify({
    paths: ["C:/notes/one.md", "C:/notes/gone.md", "C:/notes/two.md"],
    active: "C:/notes/two.md"
  }));
  const frame2 = document.createElement("iframe");
  frame2.id = "fixture2";
  frame2.title = "fixture (empty start)";
  frame2.style.cssText = "width:1024px;height:768px;border:1px solid #ccc;margin-top:16px";
  document.body.appendChild(frame2);
  frame2.src = "harness.html?empty=1";
  const doc2 = await frameReady(frame2);
  const win2 = frame2.contentWindow;
  const q2 = function (selector) { return doc2.querySelector(selector); };
  for (let i = 0; i < 400 && doc2.querySelectorAll("#tabs .tab").length < 2; i++) await tick();

  const restoredNames = Array.prototype.map.call(doc2.querySelectorAll("#tabs .tab-open"), function (button) {
    return button.textContent;
  });
  const restoredActive = q2(".tab.active .tab-open");
  is("a stored session restores its tabs", restoredNames, ["one.md", "two.md"]);
  is("the stored active tab is on screen", restoredActive && restoredActive.textContent, "two.md");
  is("restoring reads only the active document", win2.__previewLoads.length, 1);

  const firstRestored = doc2.querySelectorAll("#tabs .tab-open")[0];
  if (firstRestored) firstRestored.click();
  // The click asks Rust for the document; the harness records that immediately, but
  // the strip only flips when the render lands.
  for (let i = 0; i < 400; i++) {
    const active = q2(".tab.active .tab-open");
    if (active && active.textContent === "one.md") break;
    await tick();
  }
  is("a restored tab loads when first opened", win2.__previewLoads.length, 2);
  const afterSwitch = q2(".tab.active .tab-open");
  is("and becomes the active document", afterSwitch && afterSwitch.textContent, "one.md");

  /* ---------- report ---------- */
  mark("report");
  stopWatchdog();
  const failed = results.filter(function (r) { return !r.ok; }).length;
  summary.dataset.result = failed ? "fail" : "pass";
  summary.textContent = "RESULT: " + (failed ? "FAIL" : "PASS") + " " + (results.length - failed) + "/" + results.length;
})().catch(function (error) {
  stopWatchdog();
  const summary = document.getElementById("summary");
  summary.dataset.result = "fail";
  summary.textContent = "RESULT: FAIL harness error at stage \"" + (summary.dataset.stage || "startup") + "\": " + ((error && error.message) || error);
});
</script>
</body>
</html>

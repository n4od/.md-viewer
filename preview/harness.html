<!doctype html>
<!--
  Development harness: the same markup as src/index.html, but with a fake
  `window.__TAURI__` so the real src/app.js + src/styles.css run in any Chromium
  browser. Use it to iterate on typography, the outline and the find bar without
  recompiling Rust.

    npx serve .            # or any static server
    open http://localhost:3000/preview/harness.html

  The payload below mirrors what src-tauri/src/main.rs returns for sample.md
  (pulldown-cmark output, after the ammonia pass).
-->
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>MD Viewer — preview</title>

  <script>
    // Minimal stand-in for the Tauri IPC surface used by app.js.
    (function () {
      var handlers = {};
      var payload = {
        path: "D:\\CODEs\\.md\\sample.md",
        name: "sample.md",
        dir: "D:\\CODEs\\.md",
        size: 4820,
        modified: Date.now() - 1000 * 60 * 12,
        words: 518,
        lines: 141,
        truncated: false,
        error: null,
        html: [
          "<h1>MD Viewer sample</h1>",
          "<p>This file exists to exercise every rendering path in one pass. Double-click it in Explorer, or drop it on the window.</p>",
          "<p><img alt=\"Application icon\" src=\"../src-tauri/icons/icon.png\" /></p>",
          "<h2>Text, emphasis and inline code</h2>",
          "<p>Regular prose with <strong>bold</strong>, <em>italic</em>, <del>struck through</del>, <code>inline code</code>, a <a href=\"sample-notes.md\" rel=\"noopener noreferrer\">link to the other sample</a>, an <a href=\"https://commonmark.org\" rel=\"noopener noreferrer\">external link</a>, a footnote reference<sup class=\"footnote-reference\"><a href=\"#1\" rel=\"noopener noreferrer\">1</a></sup>, H<sub>2</sub>O, and E = mc<sup>2</sup><sup>2</sup>.</p>",
          "<div class=\"footnote-definition\" id=\"1\"><sup class=\"footnote-definition-label\">1</sup><p>Footnotes keep their anchors, so this reference scrolls back here.</p></div>",
          "<h3>Lists</h3>",
          "<ul><li>Unordered item</li><li>Another item<ul><li>Nested item</li><li>A second nested item</li></ul></li><li>Third item</li></ul>",
          "<h3>Task list</h3>",
          "<ul><li><input disabled=\"\" type=\"checkbox\" checked=\"\" /> Render CommonMark</li><li><input disabled=\"\" type=\"checkbox\" checked=\"\" /> Render the GitHub extensions</li><li><input disabled=\"\" type=\"checkbox\" /> Solve everything else</li></ul>",
          "<h3>Table with alignment</h3>",
          "<table><thead><tr><th class=\"align-left\">Feature</th><th class=\"align-center\">State</th><th class=\"align-right\">Notes</th></tr></thead><tbody><tr><td class=\"align-left\">Tables</td><td class=\"align-center\">done</td><td class=\"align-right\">alignment survives sanitising</td></tr><tr><td class=\"align-left\">Local images</td><td class=\"align-center\">done</td><td class=\"align-right\">served through the asset protocol</td></tr></tbody></table>",
          "<h3>Code</h3>",
          "<p>Inline <code>cargo build --release</code> and a fenced block with a language label:</p>",
          "<pre><code class=\"language-rust\">fn parse_cli_path(args: &amp;[String]) -&gt; Option&lt;PathBuf&gt; {\n    // Windows hands us the double-clicked file as a plain argv entry.\n    args.iter().skip(1).map(PathBuf::from).find(|p| p.is_file())\n}\n</code></pre>",
          "<h3>Blockquotes and alerts</h3>",
          "<blockquote><p>A plain blockquote, indented and quiet.</p></blockquote>",
          "<blockquote class=\"markdown-alert-note\"><p>Alerts are a GitHub extension. This one is informational.</p></blockquote>",
          "<blockquote class=\"markdown-alert-warning\"><p>This one warns about something.</p></blockquote>",
          "<h3>Definition list</h3>",
          "<dl><dt>Rust</dt><dd>A language with no runtime and no garbage collector.</dd><dt>Tauri</dt><dd>A shell that puts a system webview in a native window.</dd></dl>",
          "<hr />",
          "<h2>Long section (for the scroll bar and the outline)</h2>",
          "<p>Keyboard shortcuts live in the table below. Jump around with <kbd>J</kbd> and <kbd>K</kbd>, or press <kbd>Ctrl</kbd>+<kbd>B</kbd> to toggle the outline. Text here is deliberately repetitive so the progress bar and the scroll-spy have something to chew on.</p>",
          "<p>Markdown is a plain-text formatting syntax. Markdown is a plain-text formatting syntax. Markdown is a plain-text formatting syntax. Markdown is a plain-text formatting syntax. Markdown is a plain-text formatting syntax. Markdown is a plain-text formatting syntax.</p>",
          "<h4>Deeper heading</h4>",
          "<p>Section spacing, marker colour and heading weight are all worth a look here.</p>",
          "<h5>Fifth level</h5><p>Still legible.</p>",
          "<h6>Sixth level</h6><p>Small caps label style.</p>"
        ].join("\n")
      };

      window.__TAURI__ = {
        core: {
          invoke: function (command, args) {
            if (command === "initial_document") return Promise.resolve(payload);
            if (command === "ready") return Promise.resolve();
            if (command === "reload") return Promise.resolve(Object.assign({}, payload, { words: payload.words + 1 }));
            if (command === "load_path") return Promise.resolve(Object.assign({}, payload, { name: (args && args.path) || "file.md" }));
            if (command === "open_dialog") return Promise.resolve(null);
            if (command === "open_link") return Promise.resolve({ kind: "external", url: args && args.href });
            if (command === "default_status") {
              return Promise.resolve({
                progid: "MDViewer.Markdown",
                executable: "D:\\CODEs\\.md\\src-tauri\\target\\release\\mdviewer.exe",
                isDefault: false,
                supported: true
              });
            }
            if (command === "make_default") {
              return Promise.resolve({
                progid: "MDViewer.Markdown",
                registered: true,
                pickerOpened: true,
                message: "Registered. In the Windows dialog pick MD Viewer and tick \"Always use this app\"."
              });
            }
            return Promise.resolve(null);
          },
          convertFileSrc: function (path) {
            // Inside Tauri this is http://asset.localhost/<encoded>. A plain
            // browser cannot serve that, so the harness records what Rust-side
            // paths the frontend produced and maps them back to repo-relative
            // URLs so images still render here.
            window.__lastAssetPath = path;
            var repo = "D:\\CODEs\\.md\\";
            if (path.indexOf(repo) === 0) {
              return "../" + path.slice(repo.length).replace(/\\/g, "/");
            }
            return path;
          }
        },
        event: {
          listen: function (name, handler) {
            (handlers[name] = handlers[name] || []).push(handler);
            return Promise.resolve(function () {});
          }
        }
      };
      window.__previewEmit = function (name, payload) {
        (handlers[name] || []).forEach(function (handler) { handler({ event: name, payload: payload }); });
      };
      window.__previewPayload = payload;
    })();
  </script>

  <link rel="stylesheet" href="../src/styles.css" />
  <script src="../src/app.js"></script>
</head>
<body>
  <!-- Keep this block in sync with src/index.html. -->
  <div id="progress" aria-hidden="true"></div>

  <header id="topbar">
    <div class="bar-left">
      <span class="mark" aria-hidden="true">M</span>
      <div class="title-stack">
        <span id="doc-title" class="doc-title">Markdown viewer</span>
        <span id="doc-sub" class="doc-sub"></span>
      </div>
    </div>
    <div class="bar-right">
      <span id="doc-meta" class="doc-meta"></span>
      <button id="btn-toc" class="icon-btn" type="button" title="Contents (Ctrl+B)" aria-label="Toggle contents" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M4 10h8M4 14.5h10"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" type="button" title="Theme" aria-label="Change theme">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4.2"/><path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.2 4.2l1.4 1.4M14.4 14.4l1.4 1.4M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/></svg>
      </button>
      <button id="btn-open" class="icon-btn accent" type="button" title="Open file (Ctrl+O)" aria-label="Open file">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 6.2a1.4 1.4 0 0 1 1.4-1.4h3l1.5 1.7h6.1a1.4 1.4 0 0 1 1.4 1.4v6.3a1.4 1.4 0 0 1-1.4 1.4H4.2a1.4 1.4 0 0 1-1.4-1.4z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="welcome" class="welcome">
      <div class="welcome-inner">
        <div class="wordmark" aria-hidden="true">M<span class="wordmark-caret"></span></div>
        <h1>Read Markdown,<br />nothing else.</h1>
        <p class="lede">Drop a file anywhere in this window, or open one from disk. Double-clicking a <code>.md</code> file in Explorer opens it here.</p>
        <div id="welcome-error" class="error-card welcome-error" hidden role="alert"></div>
        <button id="welcome-open" class="btn-primary" type="button">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.8 6.2a1.4 1.4 0 0 1 1.4-1.4h3l1.5 1.7h6.1a1.4 1.4 0 0 1 1.4 1.4v6.3a1.4 1.4 0 0 1-1.4 1.4H4.2a1.4 1.4 0 0 1-1.4-1.4z"/></svg>
          Open a Markdown file
        </button>
        <button id="welcome-default" class="btn-ghost" type="button">Set as default for .md files</button>
        <p id="default-status" class="default-status" hidden></p>
        <p class="hint"><kbd>Ctrl</kbd><kbd>O</kbd> to open <span class="dot">·</span> <kbd>F5</kbd> to reload <span class="dot">·</span> drag &amp; drop supported</p>
        <div id="recent-wrap" class="recent-wrap" hidden>
          <div class="recent-label">Recently opened</div>
          <div id="recent-list" class="recent-list"></div>
        </div>
      </div>
    </section>

    <div id="error" class="error-card" hidden role="alert"></div>
    <article id="doc" class="markdown" hidden aria-label="Document"></article>

    <div id="doc-footer" class="doc-footer" hidden>
      <span id="footer-words"></span>
      <span class="seed">·</span>
      <span id="footer-path" class="footer-path"></span>
    </div>
  </main>

  <div id="toc-scrim" hidden></div>
  <aside id="toc" class="toc" hidden aria-label="Contents">
    <div class="toc-head">
      <span>Contents</span>
      <button id="toc-close" class="icon-btn small" type="button" aria-label="Close contents">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </div>
    <nav id="toc-list" class="toc-list"></nav>
  </aside>

  <div id="dropzone" class="dropzone" hidden aria-hidden="true">
    <div class="drop-card">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7 9m5-5l5 5M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
      <span>Drop to read</span>
    </div>
  </div>

  <div id="findbar" class="findbar" hidden>
    <input id="find-input" type="text" placeholder="Find in document" spellcheck="false" autocomplete="off" aria-label="Find in document" />
    <span id="find-count" class="find-count">0/0</span>
    <button id="find-prev" class="icon-btn small" type="button" title="Previous (Shift+Enter)" aria-label="Previous match">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5m0 0L5 10m5-5l5 5"/></svg>
    </button>
    <button id="find-next" class="icon-btn small" type="button" title="Next (Enter)" aria-label="Next match">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 5v10m0 0l5-5m-5 5l-5-5"/></svg>
    </button>
    <button id="find-close" class="icon-btn small" type="button" title="Close (Esc)" aria-label="Close find">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>

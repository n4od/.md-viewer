name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: check & test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The frontend is three static files with no dependencies. This keeps it that
      # way: if a change needs more room, raise the budget deliberately in review.
      # Raised 80/46 -> 88/52 after the 0.2.0 batch, 88/52 -> 96/56 once tabs, the
      # pinned section title and the image lightbox were in, and 96/56 -> 108/62 for
      # the settings panel, the largest single frontend change so far. Still far below
      # what a bundler or a framework would cost, which is what the ceiling is for.
      - name: Frontend size budget
        working-directory: .
        shell: pwsh
        run: |
          $totalBudget = 108KB
          $jsBudget    = 62KB
          $total = (Get-ChildItem src -File | Measure-Object -Property Length -Sum).Sum
          $js    = (Get-Item src/app.js).Length
          'src/ total {0:N1} KB of {1:N0} KB; app.js {2:N1} KB of {3:N0} KB' -f `
            ($total / 1KB), ($totalBudget / 1KB), ($js / 1KB), ($jsBudget / 1KB)
          if ($total -gt $totalBudget) { throw ("src/ is {0:N1} KB, over the {1:N0} KB budget" -f ($total / 1KB), ($totalBudget / 1KB)) }
          if ($js -gt $jsBudget)       { throw ("src/app.js is {0:N1} KB, over the {1:N0} KB budget" -f ($js / 1KB), ($jsBudget / 1KB)) }

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --all-targets

      # The registry integration test is #[ignore]d on purpose; it writes HKCU.
      - name: cargo test
        run: cargo test
        env:
          RUST_BACKTRACE: 1
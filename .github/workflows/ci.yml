name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: check & test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The frontend is three static files with no dependencies. This keeps it that
      # way: if a change needs more room, raise the budget deliberately in review.
      # Raised 80/46 -> 88/52 after the 0.2.0 batch, 88/52 -> 96/56 once tabs, the
      # pinned section title and the image lightbox were in, and 96/56 -> 108/62 for
      # the settings panel, the largest single frontend change so far. Still far below
      # what a bundler or a framework would cost, which is what the ceiling is for.
      - name: Frontend size budget
        working-directory: .
        shell: pwsh
        run: |
          $totalBudget = 108KB
          $jsBudget    = 62KB
          $total = (Get-ChildItem src -File | Measure-Object -Property Length -Sum).Sum
          $js    = (Get-Item src/app.js).Length
          'src/ total {0:N1} KB of {1:N0} KB; app.js {2:N1} KB of {3:N0} KB' -f `
            ($total / 1KB), ($totalBudget / 1KB), ($js / 1KB), ($jsBudget / 1KB)
          if ($total -gt $totalBudget) { throw ("src/ is {0:N1} KB, over the {1:N0} KB budget" -f ($total / 1KB), ($totalBudget / 1KB)) }
          if ($js -gt $jsBudget)       { throw ("src/app.js is {0:N1} KB, over the {1:N0} KB budget" -f ($js / 1KB), ($jsBudget / 1KB)) }

      # The front end has no test-runner dependency: preview/tests.html drives the
      # real app.js inside an iframe of the harness, and a headless browser is asked
      # for the settled DOM. Edge is the stock runner's browser; Chrome is the
      # fallback because Edge is sometimes stale or absent on hosted images.
      - name: Front-end tests
        working-directory: .
        shell: pwsh
        run: |
          $server = Start-Process -FilePath "node" -ArgumentList "scripts/dev-server.js", "8123" -PassThru -WindowStyle Hidden
          $profile = Join-Path $env:TEMP "mdviewer-test-profile"
          try {
            # The server binds 127.0.0.1 only, so do not use "localhost" here.
            $base = "http://127.0.0.1:8123"
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                Invoke-WebRequest -Uri "$base/preview/tests.html" -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 250 }
            }
            if (-not $ready) { throw "the preview server never came up on $base" }

            # ${env:...} is required for the x86 name: "$env:ProgramFiles(x86)" parses as
            # $env:ProgramFiles followed by a literal "(x86)", silently testing a path that
            # does not exist. Edge lives in Program Files (x86) on every x64 Windows.
            $browsers = @(
              "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles}\Microsoft\Edge\Application\msedge.exe",
              "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
              "${env:LOCALAPPDATA}\Google\Chrome\Application\chrome.exe"
            ) | Where-Object { Test-Path $_ }
            if (-not $browsers) { throw "neither Edge nor Chrome is installed on the runner" }

            $dom = Join-Path $env:TEMP "mdviewer-tests-dom.html"
            $errors = Join-Path $env:TEMP "mdviewer-tests-dom.err"
            $page = $null
            foreach ($browser in $browsers) {
              "browser: $browser"
              # A profile left behind by a previous candidate would be rejected; start clean.
              Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
              $arguments = @(
                "--headless=new", "--disable-gpu", "--no-first-run", "--no-default-browser-check",
                "--disable-logging", "--log-level=3",
                "--user-data-dir=`"$profile`"", "--virtual-time-budget=60000",
                "--dump-dom", "$base/preview/tests.html"
              )
              # Both browsers are GUI-subsystem binaries: without redirection their stdout
              # goes nowhere, so --dump-dom writes to a file instead of a pipe.
              $process = Start-Process -FilePath $browser -ArgumentList $arguments `
                -RedirectStandardOutput $dom -RedirectStandardError $errors -PassThru -NoNewWindow
              if (-not $process.WaitForExit(180000)) {
                $process.Kill()
                throw "the headless browser did not exit within three minutes"
              }
              $page = Get-Content $dom -Raw -ErrorAction SilentlyContinue

              # Enough to diagnose a stall without the raw DOM: the state the page reached
              # and how far its check log got. tests.html names the stage it is in, and its
              # watchdog turns a hang into a failure rather than a forever "running".
              if ($page -match 'data-result="([a-z]+)"') { "  state:   " + $Matches[1] }
              if ($page -match 'data-stage="([a-z ]+)"')   { "  stage:   " + $Matches[1] }
              if ($page -match '(?s)<p id="summary"[^>]*>(.*?)</p>') { "  summary: " + ($Matches[1] -replace '\s+', ' ') }
              if ($page -match '(?s)<pre id="log">(.*?)</pre>') {
                $tail = ($Matches[1] -split "`n") | Where-Object { $_.Trim() } | Select-Object -Last 4
                if ($tail) { "  log:     " + ($tail -join " | ") }
              }
              if ($page -notmatch 'data-result="(pass|fail)"') {
                "  dom:     " + $(if ($page) { "$($page.Length) chars" } else { "empty" }) + ", browser exit " + $process.ExitCode
                Get-Content $errors -ErrorAction SilentlyContinue | Select-Object -First 6 | ForEach-Object { "  stderr:  " + $_ }
                continue
              }
              break
            }

            if (-not $page -or $page -notmatch 'data-result="(pass|fail)"') {
              throw "no installed browser produced a finished test page"
            }
            [regex]::Match($page, 'RESULT: (PASS|FAIL)[^<]*').Value
            if ($page -notmatch 'data-result="pass"') {
              [regex]::Matches($page, 'FAIL [^<\r\n]{0,140}') | ForEach-Object { "  " + $_.Value }
              throw "front-end tests failed"
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Remove-Item $profile -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --all-targets

      # The registry integration test is #[ignore]d on purpose; it writes HKCU.
      - name: cargo test
        run: cargo test
        env:
          RUST_BACKTRACE: 1
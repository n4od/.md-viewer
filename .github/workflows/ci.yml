name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: check & test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The frontend is three static files with no dependencies. This keeps it that
      # way: if a change needs more room, raise the budget deliberately in review.
      # Raised from 80/46 KB after the 0.2.0 batch took the frontend from 60.7 KB at
      # v0.1.1 to 82.2 KB of dependency-free code; the ceiling still rules out a
      # bundler or a framework.
      - name: Frontend size budget
        working-directory: .
        shell: pwsh
        run: |
          $totalBudget = 88KB
          $jsBudget    = 52KB
          $total = (Get-ChildItem src -File | Measure-Object -Property Length -Sum).Sum
          $js    = (Get-Item src/app.js).Length
          'src/ total {0:N1} KB of {1:N0} KB; app.js {2:N1} KB of {3:N0} KB' -f `
            ($total / 1KB), ($totalBudget / 1KB), ($js / 1KB), ($jsBudget / 1KB)
          if ($total -gt $totalBudget) { throw ("src/ is {0:N1} KB, over the {1:N0} KB budget" -f ($total / 1KB), ($totalBudget / 1KB)) }
          if ($js -gt $jsBudget)       { throw ("src/app.js is {0:N1} KB, over the {1:N0} KB budget" -f ($js / 1KB), ($jsBudget / 1KB)) }

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo check
        run: cargo check --all-targets

      # The registry integration test is #[ignore]d on purpose; it writes HKCU.
      - name: cargo test
        run: cargo test
        env:
          RUST_BACKTRACE: 1